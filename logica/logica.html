<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logica jspsych</title>
    <script src="../jspsych/jspsych.js"></script>
    <link rel="stylesheet" href="../jspsych/jspsych.css" />
    <script src="../jspsych/plugin-html-keyboard-response.js"></script>
    <script src="../jspsych/plugin-html-button-response.js"></script>
  </head>
  <body></body>
  <script>
    // CONSTANTS
    const sequences = [
      ["2-9", "4-6"],
      ["3-8-6", "6-1-2"],
      ["3-4-1-7", "6-1-5-8"],
      ["8-4-2-3-9", "5-2-1-8-6"],
      ["3-8-9-1-7-4", "7-9-6-4-8-3"],
      ["5-1-7-4-2-3-8", "9-8-5-2-1-6-3"],
      ["1-8-4-5-9-7-6-3", "2-9-7-6-3-1-5-4"],
      ["5-3-8-7-1-2-4-6-9", "4-2-6-9-1-7-8-3-5"],
    ];

    const jsPsych = initJsPsych({
      on_finish: function () {
        jsPsych.data.displayData();
      },
    });

        var timeline = [];

    timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: "Press <strong>R</strong> to right answer or <strong>W</strong> to wrong answer",
    });

    

    function createTrial(number) {
        return {
            type: jsPsychHtmlKeyboardResponse,
            stimulus: `<div style="font-size:28px">${number}</div>`,
            choices: ["r", "w"],
            data: { level: number },
            on_finish: function (data) {
                if (data.response === "r") {
                    jsPsych.data.addProperties({ correct: true });
                } else {
                    jsPsych.data.addProperties({ correct: false });
                }
            },
        };
    }

    function createNextLevel(level) {
        return {
            timeline: [createTrial(level)],
            conditional_function: function () {
                var data = jsPsych.data.get().last(1).values()[0];
                return data.response === "r";
            },
        };
    }

    // Initial trial
    timeline.push(createTrial(0));

    // Next levels
    for (let i = 1; i <= 3; i++) {
        timeline.push(createNextLevel(i));
    }

    jsPsych.run(timeline);

    function endTest(score) {
      timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: "End of test. Your score is " + score + " points.",
      });
    }
    </script>
</html>
