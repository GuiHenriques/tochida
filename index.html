<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seleção do Estudo</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        background: linear-gradient(to right, #eee, #fff);
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        text-align: center;
        padding: 0 16px;
      }
      h1 {
        font-size: 3rem;
        color: #333;
        margin: 100px 0;
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 50px;
      }
      .option {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        box-sizing: border-box;
        width: 280px;
        height: 300px;
        padding: 28px 16px;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        text-decoration: none;
        background: #ffffff;
        color: #333;
      }
      .option:hover {
        background-color: #eee;
        transition: 0.3s;
      }
      .option h2 {
        margin: 0;
        font-size: 1.3rem;
        white-space: nowrap;
      }
      .material-symbols-outlined {
        font-size: 150px;
        color: #333;
      }
      .researcher {
        margin: 0;
        font-size: 1.1rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Selecione o Estudo</h1>
      <div class="options">
        <a href="pt-es/index.html" class="option">
          <h2>Português · Espanhol</h2>
          <span class="material-symbols-outlined">looks_one</span>
          <p class="researcher">Pesquisa de Júlia</p>
        </a>
        <a href="pt-en/index.html" class="option">
          <h2>Português · Inglês</h2>
          <span class="material-symbols-outlined">looks_two</span>
          <p class="researcher">Pesquisa de Guilherme</p>
        </a>
      </div>
    </div>
  </body>
</html>
