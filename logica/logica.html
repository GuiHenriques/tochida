<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logica jspsych</title>
    <script src="../jspsych/jspsych.js"></script>
    <link rel="stylesheet" href="../jspsych/jspsych.css" />
    <script src="../jspsych/plugin-html-keyboard-response.js"></script>
    <script src="../jspsych/plugin-html-button-response.js"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0"
    />
  </head>
  <body></body>
  <script>
    // CONSTANTS
    const sequences = [
      [
        ["2", "9"],
        ["4", "6"],
      ],
      [
        ["3", "8", "6"],
        ["6", "1", "2"],
      ],
      [
        ["3", "4", "1", "7"],
        ["6", "1", "5", "8"],
      ],
      [
        ["8", "4", "2", "3", "9"],
        ["5", "2", "1", "8", "6"],
      ],
      [
        ["3", "8", "9", "1", "7", "4"],
        ["7", "9", "6", "4", "8", "3"],
      ],
      [
        ["5", "1", "7", "4", "2", "3", "8"],
        ["9", "8", "5", "2", "1", "6", "3"],
      ],
      [
        ["1", "8", "4", "5", "9", "7", "6", "3"],
        ["2", "9", "7", "6", "3", "1", "5", "4"],
      ],
      [
        ["5", "3", "8", "7", "1", "2", "4", "6", "9"],
        ["4", "2", "6", "9", "1", "7", "8", "3", "5"],
      ],
    ];

    // Helper functions
    function getSequences(index) {
      if (index < 0 || index >= sequences.length) {
        throw new Error("Index out of bounds");
      }
      const [s1, s2] = sequences[index];
      return { s1, s2 };
    }

    function validateResponse(sequence, response) {
      return JSON.stringify(sequence) === JSON.stringify(response);
    }

    // VARIABLES
    var timeline = [];
    var score = 0;

    const jsPsych = initJsPsych({
      on_finish: function () {
        jsPsych.data.displayData();
      },
    });

    // Instructions
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: "<strong>R</strong> to right or  <strong>W</strong> to wrong",
    });

    // Function to create a Digit trial
    function createDigitTrial(digit) {
      return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `<div style="font-size:48px">${digit}</div>`,
        trial_duration: 600,
        data: { type: "digit" },
      };
    }

    // Function to create a Response trial
    function createResponseTrial(sequence) {
      var stimulusHTML = `
          <p>Enter the sequence (${sequence}):</p>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 150px; margin: 0 auto;">
            ${Array.from(
              { length: 9 },
              (_, i) =>
                `<button class="digit-button jspsych-btn" data-digit="${
                  i + 1
                }" style="font-size: 24px; padding: 10px;">${i + 1}</button>`
            ).join("")}
          </div>
          <div id="response" style="font-size: 24px; margin: 20px 0;"></div>
          <div>
          <button
            id="clear-button"
            class="jspsych-btn"
            style="font-size: 12px; padding: 5px; margin-bottom: 20px"
          >
            <span style="display: inline-block; vertical-align: middle;">Clear</span>
            <span class="material-symbols-outlined" style="display: inline-block; vertical-align: middle; margin-left: 5px;">backspace</span>
          </button>
        </div>
        `;

      let user_response = [];

      return {
        type: jsPsychHtmlButtonResponse,
        stimulus: stimulusHTML,
        choices: ['<div style="font-size:20px">Submit</div>'],
        data: { type: "response" },
        // post_trial_gap: 1000,
        on_load: function () {
          document.querySelectorAll(".digit-button").forEach((button) => {
            button.addEventListener("click", function () {
              var digit = this.getAttribute("data-digit");
              user_response.push(digit);
              document.getElementById("response").textContent =
                user_response.join(" ");
            });
          });
          document.getElementById("clear-button").addEventListener("click", function () {
            user_response.pop();
            document.getElementById("response").textContent = user_response.join(" ");
          });
        },
        on_finish: function (data) {
          data.user_response = user_response;
          data.correct = validateResponse(sequence, user_response);
          console.log("correct", data.correct);

          if (data.correct) {
            score++;
          }
          console.log("score", score);
        },
      };
    }

    function createFeedbackTrial() {
      return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function () {
          const lastTrial = jsPsych.data.get().last(1).values()[0];
          return lastTrial.correct ? "Correct!" : "Incorrect!";
        },
        trial_duration: 1000,
        choices: "NO_KEYS",
        data: { type: "feedback" },
      };
    }

    // Function to create a conditional trial block
    function createLevel(index) {
      const { s1, s2 } = getSequences(index);

      const digits1 = s1.map((digit) => createDigitTrial(digit));
      const digits2 = s2.map((digit) => createDigitTrial(digit));

      const response1 = createResponseTrial(s1);
      const response2 = createResponseTrial(s2);

      const feedback = createFeedbackTrial();

      return {
        timeline: [
          ...digits1,
          response1,
          feedback,
          ...digits2,
          response2,
          feedback,
        ],
        conditional_function: function () {
          const correctCount = jsPsych.data
            .get()
            .filter({ type: "response" })
            .last(2)
            .filter({ correct: true })
            .count();

          return correctCount > 0;
        },
      };
    }

    // Initial trial
    timeline.push(...createLevel(0).timeline);

    // Add levels
    for (let i = 1; i <= 5; i++) {
      timeline.push(createLevel(i));
    }

    // Function to generate the final score display dynamically
    function endTest() {
      return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function () {
          return `End of test. Your score is ${score} points`;
        },
      };
    }

    // Add the end test screen at the end of the timeline
    timeline.push(endTest());

    jsPsych.run(timeline);
  </script>
</html>
