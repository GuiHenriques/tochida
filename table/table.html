<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jsPsych Experiment</title>
    <script src="../jspsych/jspsych.js"></script>
    <script src="../jspsych/plugin-html-keyboard-response.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <script>
      // Paths to the placeholder images
      const creature = "blue.png";
      const object = "orange.png";

      const trials = [
        {
          square1: { creature, object: creature },
          square2: { creature, object: creature },
          square3: { creature, object: creature },
          square4: { creature, object: creature },
        },
        // {
        //   square1: { creature: object, object },
        //   square2: { creature: object, object },
        //   square3: { creature: object, object },
        //   square4: { creature: object, object },
        // },
        // Add more trials as needed
      ];

      // Function to create the HTML for the table with images
      function createImageTable(trial) {
        return `
            <table>
              <tr>
                <td>
                  <div class="container">
                    <img src="${trial.square1.creature}" alt="Creature1">
                    <img src="${trial.square1.object}" alt="Object1">
                  </div>
                </td>
                <td>
                  <div class="container">
                    <img src="${trial.square2.creature}" alt="Creature2">
                    <img src="${trial.square2.object}" alt="Object2">
                  </div>
                </td>
              </tr>
              <tr>
                <td>
                  <div class="container">
                    <img src="${trial.square3.creature}" alt="Creature 3">
                    <img src="${trial.square3.object}" alt="Object 3">
                  </div>
                </td>
                <td>
                  <div class="container">
                    <img src="${trial.square4.creature}" alt="Creature 4">
                    <img src="${trial.square4.object}" alt="Object 4">
                  </div>
                </td>
              </tr>
            </table>
          `;
      }

      // Time to display each set of images in milliseconds

      // Initialize jsPsych
      var jsPsych = initJsPsych();

      var timeline = [];
      var grid1 = createImageTable(trials[0]);

      // Instructions trial
      var instructions = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: "<p>Welcome to the experiment. Press SPACE to continue.</p>",
        choices: [" "],
      };
      timeline.push(instructions);

      // Create a timeline step for each trial using forEach
      trials.forEach((trial) => {
        let imageTrial = {
          type: jsPsychHtmlKeyboardResponse,
          stimulus: createImageTable(trial),
          // trial_duration: displayTime,
        };
        timeline.push(imageTrial);
      });

      // Start the experiment
      jsPsych.run(timeline);
    </script>
  </body>
</html>
