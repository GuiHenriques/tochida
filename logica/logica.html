<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logica jspsych</title>
    <script src="../jspsych/jspsych.js"></script>
    <link rel="stylesheet" href="../jspsych/jspsych.css" />
    <script src="../jspsych/plugin-html-keyboard-response.js"></script>
    <script src="../jspsych/plugin-html-button-response.js"></script>
  </head>
  <body></body>
  <script>
    // CONSTANTS
    const sequences = [
      ["2-9", "4-6"],
      ["3-8-6", "6-1-2"],
      ["3-4-1-7", "6-1-5-8"],
      ["8-4-2-3-9", "5-2-1-8-6"],
      ["3-8-9-1-7-4", "7-9-6-4-8-3"],
      ["5-1-7-4-2-3-8", "9-8-5-2-1-6-3"],
      ["1-8-4-5-9-7-6-3", "2-9-7-6-3-1-5-4"],
      ["5-3-8-7-1-2-4-6-9", "4-2-6-9-1-7-8-3-5"],
    ];

    const jsPsych = initJsPsych({
      on_finish: function () {
        jsPsych.data.displayData();
      },
    });

    var timeline = [];
    var score = 0;

    // Instructions
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus:
        "Press <strong>R</strong> to right answer or <strong>W</strong> to wrong answer",
      choices: "ALL_KEYS",
    });

    // Function to create a trial
    function createTrial(number) {
      return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `<div style="font-size:28px">${number}</div>`,
        choices: ["r", "w"],
        data: { level: number },
        on_finish: function (data) {
          if (data.response === "r") {
            score++;
            data.correct = true;
          } else {
            data.correct = false;
          }
          console.log("score", score);
        },
      };
    }

    // Function to create a conditional trial block
    function createLevel(level) {
      const stage1 = createTrial(level);
      const stage2 = createTrial(level);

      return {
        timeline: [stage1, stage2],
        conditional_function: function () {
          const correctCount = jsPsych.data
            .get()
            .last(2)
            .filter({ correct: true })
            .count();
          return correctCount > 0;
        },
      };
    }

    // Initial trial to ensure the conditional logic starts correctly
    timeline.push(createTrial(0));
    timeline.push(createTrial(0));

    // Add levels
    for (let i = 1; i <= 5; i++) {
      timeline.push(createLevel(i));
    }

    // Function to generate the final score display dynamically
    function endTest() {
      return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function () {
          return `End of test. Your score is ${score} points`;
        },
      };
    }

    // Add the end test screen at the end of the timeline
    timeline.push(endTest());

    jsPsych.run(timeline);
  </script>
</html>
