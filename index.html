<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seleção do Estudo</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
    />
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        background: linear-gradient(to right, #eee, #fff);
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        text-align: center;
        padding: 0 16px;
      }
      h1 {
        font-size: 3rem;
        color: #333;
        margin: 100px 0;
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 50px;
      }
      .option {
        display: flex;
        justify-content: center;
        width: 250px;
        height: 300px;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        text-decoration: none;
        background: #ffffff;
        color: #333;
      }
      .option:hover {
        background-color: #eee;
        transition: 0.3s;
      }
      .icon {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 150px;
      }
      .material-symbols-outlined {
        font-size: 120px;
        color: #333;
      }
      .languages {
        font-size: 1.1rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Selecione o Estudo</h1>
      <div class="options">
        <a href="estudo-1/index.html" class="option">
          <div>
            <h2>Estudo 1</h2>
            <div class="icon">
              <span class="material-symbols-outlined"> looks_one </span>
            </div>
            <p class="languages">Português · Espanhol</p>
          </div>
        </a>
        <a href="estudo-2/index.html" class="option">
          <div>
            <h2>Estudo 2</h2>
            <div class="icon">
              <span class="material-symbols-outlined"> looks_two </span>
            </div>
            <p class="languages">Português · Inglês</p>
          </div>
        </a>
      </div>
    </div>
  </body>
</html>
