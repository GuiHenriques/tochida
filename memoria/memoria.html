<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Digit Span Task</title>
    <script src="../jspsych/jspsych.js"></script>
    <link rel="stylesheet" href="../jspsych/jspsych.css" />
    <script src="../jspsych/plugin-html-keyboard-response.js"></script>
    <script src="../jspsych/plugin-html-button-response.js"></script>
  </head>
  <body></body>
  <script>
    // Initialize jsPsych
    const jsPsych = initJsPsych({
      on_finish: function () {
        jsPsych.data.displayData();
      },
    });
    var timeline = [];

    // Instructions
    let instructions = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus:
        "<h2>Esta es una tarea de memoria.</h2>" +
        "<p>Essa é uma tarefa de memória.</p>" +
        "<br>" +
        "<h3>Algunos números surgirán en la pantalla, Pon atención. Cuándo termine, repita la secuencia. </h3>" +
        "<p>Alguns números aparecerão na tela, observe com atenção. Assim que terminar, repita a sequência.</p>" +
        "<br>",

      choices: "ALL_KEYS",
      prompt:
        "<h4>Presione cualquier tecla para continuar.</h4>" +
        "<p>Pressione qualquer tecla para continuar.</p>",
      data: { part: "instructions"}
    };
    timeline.push(instructions);

    // Helper function to generate a random digit sequence
    function generateDigitSequence(length) {
      var digits = [];
      for (var i = 0; i < length; i++) {
        digits.push(Math.floor(Math.random() * 9) + 1); // digits 1-9
      }
      return digits;
    }

    // Helper functionS to validate the user's response
    function validateResponse(sequence, response) {
      return JSON.stringify(sequence) === JSON.stringify(response);
    }

    function validateBackwardResponse(sequence, response) {
      return JSON.stringify(sequence.reverse()) === JSON.stringify(response);
    }

    // Trial to display each digit for one second|
    function createDigitDisplayTrial(digit) {
      return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: '<div style="font-size: 48px;">' + digit + "</div>",
        choices: "NO_KEYS",
        trial_duration: 500,
        data: { part: "digit-display" },
      };
    }

    // Trial to collect user's response using buttons
    function createUserResponseTrial(sequence) {
      var stimulusHTML = `
          <p>Enter the sequence:</p>
          <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 150px; margin: 0 auto;">
            ${Array.from(
              { length: 9 },
              (_, i) =>
                `<button class="digit-button jspsych-btn" data-digit="${
                  i + 1
                }" style="font-size: 24px; padding: 10px;">${i + 1}</button>`
            ).join("")}
          </div>
          <div id="response" style="font-size: 24px; margin: 20px 0;"></div>
        `;

      let user_response = [];

      return {
        type: jsPsychHtmlButtonResponse,
        stimulus: stimulusHTML,
        choices: ["Submit"],
        on_load: function () {
          document.querySelectorAll(".digit-button").forEach((button) => {
            button.addEventListener("click", function () {
              var digit = this.getAttribute("data-digit");
              user_response.push(parseInt(digit));
              document.getElementById("response").textContent =
                user_response.join(" ");
            });
          });
        },
        on_finish: function (data) {
          var response = data.response;
          console.log(validateResponse(sequence, user_response));
          data.sequence = sequence;
          data.user_response = user_response;
          data.correct = validateResponse(sequence, user_response);
        },
        data: { part: "user-response" },
      };
    }

     // Helper function to create a trial block
    function createTrialBlock(sequence) {
      const trials = sequence.map((digit) => createDigitDisplayTrial(digit));
      trials.push(createUserResponseTrial(sequence));
      return trials;
    }

    // Main function to create trials for each digit sequence length
    function createDigitSpanTrials() {
      let sequenceLength = 2;
      let continueExperiment = true;

      while (sequenceLength <= 5 && continueExperiment) {
        console.log("Sequence length:", sequenceLength);

        const sequence1 = generateDigitSequence(sequenceLength);
        const trials1 = createTrialBlock(sequence1);
        
        const block1 = {
          timeline: trials1,
          on_finish: function (data) {
            const userResponses = jsPsych.data.get().filter({ part: "user-response" });
            const correctResponses = userResponses.last(sequence1.length).filter({ correct: true }).count();
            console.log("User responses for sequence 1:", userResponses.values());
            console.log("Correct responses for sequence 1:", correctResponses);
            return correctResponses === sequence1.length;
          }
        };
        
        
        
        const sequence2 = generateDigitSequence(sequenceLength);
        const trials2 = createTrialBlock(sequence2);
        const block2 = {
          timeline: trials2,
          on_finish: function (data) {
            const userResponses = jsPsych.data.get().filter({ part: "user-response" });
            const correctResponses = userResponses.last(sequence2.length).filter({ correct: true }).count();
            console.log("User responses for sequence 2:", userResponses.values());
            console.log("Correct responses for sequence 2:", correctResponses);
            return correctResponses === sequence2.length;
          }
        };

        timeline.push(block1);
        timeline.push(block2);

        // Check if at least one sequence was correct
        const userResponsesBlock1 = jsPsych.data.get().filter({ part: "user-response" }).last(sequence1.length);
        const userResponsesBlock2 = jsPsych.data.get().filter({ part: "user-response" }).last(sequence2.length);
        const correctResponsesBlock1 = userResponsesBlock1.filter({ correct: true }).count();
        const correctResponsesBlock2 = userResponsesBlock2.filter({ correct: true }).count();

        if (correctResponsesBlock1 !== sequence1.length && correctResponsesBlock2 !== sequence2.length) {
          continueExperiment = false;
        }

        sequenceLength++;
      }

      timeline.push({
        type: jsPsychHtmlKeyboardResponse,
        stimulus: "End of the experiment"
      });
    }

    // Start the experiment
    createDigitSpanTrials();

    jsPsych.run(timeline);
  </script>
</html>
