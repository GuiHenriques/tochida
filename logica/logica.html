<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logica jspsych</title>
    <script src="../jspsych/jspsych.js"></script>
    <link rel="stylesheet" href="../jspsych/jspsych.css" />
    <script src="../jspsych/plugin-html-keyboard-response.js"></script>
    <script src="../jspsych/plugin-html-button-response.js"></script>
  </head>
  <body></body>
  <script>
    // CONSTANTS
    const sequences = [
      [
        ["2", "9"],
        ["4", "6"],
      ],
      [
        ["3", "8", "6"],
        ["6", "1", "2"],
      ],
      [
        ["3", "4", "1", "7"],
        ["6", "1", "5", "8"],
      ],
      [
        ["8", "4", "2", "3", "9"],
        ["5", "2", "1", "8", "6"],
      ],
      [
        ["3", "8", "9", "1", "7", "4"],
        ["7", "9", "6", "4", "8", "3"],
      ],
      [
        ["5", "1", "7", "4", "2", "3", "8"],
        ["9", "8", "5", "2", "1", "6", "3"],
      ],
      [
        ["1", "8", "4", "5", "9", "7", "6", "3"],
        ["2", "9", "7", "6", "3", "1", "5", "4"],
      ],
      [
        ["5", "3", "8", "7", "1", "2", "4", "6", "9"],
        ["4", "2", "6", "9", "1", "7", "8", "3", "5"],
      ],
    ];

    function getSequences(index) {
      if (index < 0 || index >= sequences.length) {
        throw new Error("Index out of bounds");
      }
      return sequences[index];
    }

    const jsPsych = initJsPsych({
      on_finish: function () {
        jsPsych.data.displayData();
      },
    });

    var timeline = [];
    var score = 0;

    // Instructions
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: "<strong>R</strong> to right or  <strong>W</strong> to wrong",
    });

    // Function to create a Digit trial
    function createDigitTrial(digit) {
      return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `<div style="font-size:48px">${digit}</div>`,
        trial_duration: 600,
        data: { type: "digit"},
      }
    }

    // Function to create a Response trial
    function createResponseTrial(number) {
      return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `<div style="font-size:28px">${number}</div>`,
        choices: ["r", "w"],
        data: { type: "response" },
        on_finish: function (data) {
          if (data.response === "r") {
            score++;
            data.correct = true;
          } else {
            data.correct = false;
          }
          console.log("score", score);
        },
      };
    }

    // Function to create a conditional trial block
    function createLevel(sequence1, sequence2) {
      
      const stage1 = createResponseTrial(sequence1);
      const stage2 = createResponseTrial(sequence2);

      return {
        timeline: [stage1, stage2],
        conditional_function: function () {
          const correctCount = jsPsych.data
            .get()
            .filter({ type: "response"})
            .last(2)
            .filter({ correct: true })
            .count();

          return correctCount > 0;
        },
      };
    }

    // Initial trial to ensure the conditional logic starts correctly
    const [s1, s2] = getSequences(0);
    for (let digit of s1) {
      timeline.push(createDigitTrial(digit));
    }
    timeline.push(createResponseTrial(0));

    for (let digit of s2) {
      timeline.push(createDigitTrial(digit));
    }
    timeline.push(createResponseTrial(0));

    // Add levels
    for (let i = 1; i <= 5; i++) {

      timeline.push(createLevel(s1, s2));
    }

    // Function to generate the final score display dynamically
    function endTest() {
      return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function () {
          return `End of test. Your score is ${score} points`;
        },
      };
    }

    // Add the end test screen at the end of the timeline
    timeline.push(endTest());

    jsPsych.run(timeline);
  </script>
</html>
