<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logica jspsych</title>
    <script src="../jspsych/jspsych.js"></script>
    <link rel="stylesheet" href="../jspsych/jspsych.css" />
    <script src="../jspsych/plugin-html-keyboard-response.js"></script>
    <script src="../jspsych/plugin-html-button-response.js"></script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0"
    />
  </head>
  <body></body>
  <script>
    // CONSTANTS
    const sequences = [
      [
        ["2", "9"],
        ["4", "6"],
      ],
      [
        ["3", "8", "6"],
        ["6", "1", "2"],
      ],
      [
        ["3", "4", "1", "7"],
        ["6", "1", "5", "8"],
      ],
      [
        ["8", "4", "2", "3", "9"],
        ["5", "2", "1", "8", "6"],
      ],
      [
        ["3", "8", "9", "1", "7", "4"],
        ["7", "9", "6", "4", "8", "3"],
      ],
      [
        ["5", "1", "7", "4", "2", "3", "8"],
        ["9", "8", "5", "2", "1", "6", "3"],
      ],
      [
        ["1", "8", "4", "5", "9", "7", "6", "3"],
        ["2", "9", "7", "6", "3", "1", "5", "4"],
      ],
      [
        ["5", "3", "8", "7", "1", "2", "4", "6", "9"],
        ["4", "2", "6", "9", "1", "7", "8", "3", "5"],
      ],
    ];

    const backwardSequences = [
      [
        ["8", "2"],
        ["5", "6"],
      ],
      [
        ["2", "1"],
        ["1", "3"],
      ],
      [
        ["3", "5"],
        ["6", "4"],
      ],
      [
        ["5", "7", "4"],
        ["2", "5", "9"],
      ],
      [
        ["7", "2", "9", "6"],
        ["8", "4", "9", "3"],
      ],
      [
        ["4", "1", "3", "5", "7"],
        ["9", "7", "8", "5", "2"],
      ],
      [
        ["1", "6", "5", "2", "9", "8"],
        ["3", "6", "7", "1", "9", "4"],
      ],
      [
        ["8", "5", "9", "2", "3", "4", "6"],
        ["4", "5", "7", "9", "2", "8", "1"],
      ],
      [
        ["6", "9", "1", "7", "3", "2", "5", "8"],
        ["3", "1", "7", "9", "5", "4", "8", "2"],
      ],
    ];

    // Helper functions
    function getSequences(index) {
      if (index < 0 || index >= sequences.length) {
        throw new Error("Index out of bounds");
      }
      const [s1, s2] = sequences[index];
      return { s1, s2 };
    }

    function validateResponse(sequence, response) {
      return JSON.stringify(sequence) === JSON.stringify(response);
    }

    function getBackwardSequences(index) {
      if (index < 0 || index >= backwardSequences.length) {
        throw new Error("Index out of bounds");
      }
      const [s1, s2] = backwardSequences[index];
      return { s1, s2 };
    }

    function validateBackwardResponse(sequence, response) {
      if (sequence.length !== response.length) {
        return false;
      }
      for (let i = 0; i < sequence.length; i++) {
        if (sequence[i] !== response[sequence.length - 1 - i]) {
          return false;
        }
      }
      return true;
    }

    // VARIABLES
    let timeline = [];
    let direct_score = 0;
    let inward_score = -2;
    let total_score = 0;

    const jsPsych = initJsPsych({
      on_finish: function () {
        jsPsych.data.displayData();
      },
    });

    // Instructions
    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: "Direct order",
    });

    // Function to create a Digit trial
    function createDigitTrial(digit) {
      return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: `<div style="font-size:48px">${digit}</div>`,
        trial_duration: 600,
        data: { type: "digit" },
      };
    }

    // Function to create a Response trial
    function createResponseTrial(sequence, backward = false) {
      let stimulusHTML = `
              <p>Enter the sequence (${sequence}):</p>
              <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 150px; margin: 0 auto;">
                ${Array.from(
                  { length: 9 },
                  (_, i) =>
                    `<button class="digit-button jspsych-btn" data-digit="${
                      i + 1
                    }" style="font-size: 24px; padding: 10px;">${
                      i + 1
                    }</button>`
                ).join("")}
              </div>
              <div id="response" style="font-size: 24px; margin: 20px 0;"></div>
              <div>
              <button
                id="clear-button"
                class="jspsych-btn"
                style="font-size: 12px; padding: 5px; margin-bottom: 20px"
              >
                <span style="display: inline-block; vertical-align: middle;">Clear</span>
                <span class="material-symbols-outlined" style="display: inline-block; vertical-align: middle; margin-left: 5px;">backspace</span>
              </button>
            </div>
            `;

      let user_response = [];

      return {
        type: jsPsychHtmlButtonResponse,
        stimulus: stimulusHTML,
        choices: ['<div style="font-size:20px">Submit</div>'],
        data: { type: "response" },
        // post_trial_gap: 1000,
        on_load: function () {
          document.querySelectorAll(".digit-button").forEach((button) => {
            button.addEventListener("click", function () {
              let digit = this.getAttribute("data-digit");
              user_response.push(digit);
              document.getElementById("response").textContent =
                user_response.join(" ");
            });
          });
          document
            .getElementById("clear-button")
            .addEventListener("click", function () {
              user_response.pop();
              document.getElementById("response").textContent =
                user_response.join(" ");
            });
        },
        on_finish: function (data) {
          data.user_response = user_response;
          if (backward) {
            data.correct = validateBackwardResponse(sequence, user_response);
            if (data.correct) {
              inward_score++;
            }
          } else {
            data.correct = validateResponse(sequence, user_response);
            if (data.correct) {
              direct_score++;
            }
          }
          console.log(direct_score, inward_score);
          user_response = [];
        },
      };
    }

    function createFeedbackTrial() {
      return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function () {
          const lastTrial = jsPsych.data.get().last(1).values()[0];
          return lastTrial.correct ? "Correct!" : "Incorrect!";
        },
        trial_duration: 1000,
        choices: "NO_KEYS",
        data: { type: "feedback" },
      };
    }

    // Function to create a conditional trial block
    function createLevel(index, backward = false) {
      let s1, s2;

      if (!backward) {
        ({ s1, s2 } = getSequences(index));
      } else {
        ({ s1, s2 } = getBackwardSequences(index));
      }

      const digits1 = s1.map((digit) => createDigitTrial(digit));
      const digits2 = s2.map((digit) => createDigitTrial(digit));

      const response1 = createResponseTrial(s1, backward);
      const response2 = createResponseTrial(s2, backward);

      const feedback = createFeedbackTrial();

      return {
        timeline: [
          ...digits1,
          response1,
          feedback,
          ...digits2,
          response2,
          feedback,
        ],
        conditional_function: function () {
          const correctCount = jsPsych.data
            .get()
            .filter({ type: "response" })
            .last(2)
            .filter({ correct: true })
            .count();

          return correctCount > 0;
        },
      };
    }

    // Function to add levels to the timeline
    function addDirectTrials() {
      // Initial trial
      timeline.push(...createLevel(0).timeline);

      // Add levels
      for (let i = 1; i <= 5; i++) {
        timeline.push(createLevel(i));
      }
    }
    // addDirectTrials();

    // Instructions Inward order

    timeline.push({
      type: jsPsychHtmlKeyboardResponse,
      stimulus: "Inward order",
    });

    // Function to create a practice trial
    function createPracticeTrial(sequence) {
      const practiceDigitTrials = sequence.map((digit) =>
        createDigitTrial(digit)
      );
      const practiceResponseTrial = createResponseTrial(sequence, true);
      const feedback = createFeedbackTrial();

      return {
        timeline: [...practiceDigitTrials, practiceResponseTrial, feedback],
        loop_function: function (data) {
          const trialsData = data.values();
          const responseTrialData = trialsData[trialsData.length - 2];
          return !responseTrialData.correct;
        },
      };
    }

    // Practice level
    function createPraticeLevel() {
      let s1, s2;

      ({ s1, s2 } = getBackwardSequences(0));

      const practice1 = createPracticeTrial(s1);
      const practice2 = createPracticeTrial(s2);

      return {
        timeline: [practice1, practice2],
      };
    }
    timeline.push(createPraticeLevel());

    // Function to add levels to the timeline
    function addInwardTrials() {
      for (let i = 1; i <= 8; i++) {
        timeline.push(createLevel(i, true));
      }
    }
    addInwardTrials();

    // Function to generate the final score display dynamically
    function endTest(backward = false, final = false) {
      return {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: function () {
          const total_score = direct_score + inward_score;
          return `
                <p>Direct order score: ${direct_score}</p>
                <p>Inward order score: ${inward_score}</p>
                <p>Total score: ${total_score}</p>
            `;
        },
        choices: "NO_KEYS",
      };
    }
    timeline.push(endTest());

    jsPsych.run(timeline);
  </script>
</html>
