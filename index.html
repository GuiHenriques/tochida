<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seleção do Estudo</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        background: linear-gradient(to right, #eee, #fff);
        display: flex;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        text-align: center;
        padding: 0 16px;
      }
      h1 {
        font-size: 3rem;
        color: #333;
        margin: 100px 0;
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 50px;
      }
      .option {
        display: flex;
        justify-content: center;
        width: 250px;
        height: 300px;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        text-decoration: none;
        background: #ffffff;
        color: #333;
      }
      .option:hover {
        background-color: #eee;
        transition: 0.3s;
      }
      .option h2 {
        font-size: 1.4rem;
        margin: 24px 16px 0;
      }
      .code {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 160px;
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: 2px;
        color: #333;
      }
      .researcher {
        font-size: 1.1rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Selecione o Estudo</h1>
      <div class="options">
        <a href="pt-es/index.html" class="option">
          <div>
            <h2>Português · Espanhol</h2>
            <div class="code">PT · ES</div>
            <p class="researcher">Pesquisa de Júlia</p>
          </div>
        </a>
        <a href="pt-en/index.html" class="option">
          <div>
            <h2>Português · Inglês</h2>
            <div class="code">PT · EN</div>
            <p class="researcher">Pesquisa de Guilherme</p>
          </div>
        </a>
      </div>
    </div>
  </body>
</html>
